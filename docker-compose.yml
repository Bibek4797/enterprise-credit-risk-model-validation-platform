version: '3.8'

services:
  credit-risk-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: credit_risk_analytics_platform
    ports:
      - "8501:8501"
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models
      - ./logs:/app/logs
      - ./reports:/app/reports
    restart: unless-stopped
